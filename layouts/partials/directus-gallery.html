{{/* Directus image gallery partial */}}
{{/* Usage: {{ partial "directus-gallery" .Params.gallery }} */}}

{{ $images := . }}
{{ if $images }}
<div class="image-gallery">
  {{ range $index, $image := $images }}
  <figure class="gallery-item">
    <a href="/assets/{{ $image.id }}" 
       data-lightbox="gallery" 
       data-title="{{ $image.title | default $image.description }}">
      <picture>
        <source 
          type="image/webp"
          srcset="/assets/transform/{{ $image.id }}?width=300&height=300&fit=cover&format=webp">
        <img 
          src="/assets/transform/{{ $image.id }}?width=300&height=300&fit=cover&format=jpg"
          alt="{{ $image.description | default $image.title }}"
          loading="lazy"
          decoding="async">
      </picture>
    </a>
    {{ if or $image.title $image.description }}
    <figcaption>{{ $image.title | default $image.description }}</figcaption>
    {{ end }}
  </figure>
  {{ end }}
</div>

<style>
.image-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 1rem;
  margin: 2rem 0;
}

.gallery-item {
  margin: 0;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: transform 0.3s ease;
}

.gallery-item:hover {
  transform: translateY(-4px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.gallery-item figcaption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  color: white;
  padding: 1rem;
  font-size: 0.875rem;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}

.gallery-item:hover figcaption {
  transform: translateY(0);
}
</style>
{{ end }}
