{{/* Contact form that submits to Directus */}}
<form id="contact-form" class="contact-form" method="POST">
  <div class="form-group">
    <label for="name">Name *</label>
    <input type="text" id="name" name="name" required>
  </div>
  
  <div class="form-group">
    <label for="email">Email *</label>
    <input type="email" id="email" name="email" required>
  </div>
  
  <div class="form-group">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone">
  </div>
  
  <div class="form-group">
    <label for="service_interest">Service Interest</label>
    <select id="service_interest" name="service_interest">
      <option value="">Select a service...</option>
      <option value="delphi-notify">Delphi Notify XDR/SIEM</option>
      <option value="training">Security Awareness Training</option>
      <option value="consulting">Security Consulting</option>
      <option value="other">Other</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="subject">Subject *</label>
    <input type="text" id="subject" name="subject" required>
  </div>
  
  <div class="form-group">
    <label for="message">Message *</label>
    <textarea id="message" name="message" rows="5" required></textarea>
  </div>
  
  <div class="form-group">
    <button type="submit" class="btn btn-primary">Send Message</button>
  </div>
  
  <div id="form-message" class="form-message"></div>
</form>

<script>
document.getElementById('contact-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData);
  const messageDiv = document.getElementById('form-message');
  
  // Show loading
  messageDiv.innerHTML = '<p class="info">Sending message...</p>';
  
  try {
    const response = await fetch('/api/custom/email-handler/contact-form', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data)
    });
    
    const result = await response.json();
    
    if (result.success) {
      messageDiv.innerHTML = '<p class="success">Thank you! Your message has been sent.</p>';
      e.target.reset();
    } else {
      messageDiv.innerHTML = '<p class="error">Sorry, there was an error sending your message. Please try again.</p>';
    }
  } catch (error) {
    messageDiv.innerHTML = '<p class="error">Sorry, there was an error sending your message. Please try again.</p>';
    console.error('Form submission error:', error);
  }
});
</script>

<style>
.contact-form {
  max-width: 600px;
  margin: 2rem 0;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 1rem;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #007bff;
  box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
}

.btn {
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-primary {
  background: #007bff;
  color: white;
}

.btn-primary:hover {
  background: #0056b3;
}

.form-message {
  margin-top: 1rem;
}

.form-message .success {
  color: #28a745;
  background: #d4edda;
  padding: 0.75rem;
  border-radius: 4px;
}

.form-message .error {
  color: #dc3545;
  background: #f8d7da;
  padding: 0.75rem;
  border-radius: 4px;
}

.form-message .info {
  color: #004085;
  background: #d1ecf1;
  padding: 0.75rem;
  border-radius: 4px;
}
</style>
