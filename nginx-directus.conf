# nginx-directus.conf
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache settings for Directus assets
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=assets_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Upstream for Directus
    upstream directus {
        server directus:8055;
    }

    # Main site
    server {
        listen 80;
        server_name cybermonkey.net.au www.cybermonkey.net.au;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Hugo static site
        location / {
            root /var/www/html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Directus uploads (direct file access)
        location /assets/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Security for PDFs
            location ~ \.pdf$ {
                add_header X-Content-Type-Options nosniff;
                add_header Content-Disposition "attachment";
            }

            # Image optimization headers
            location ~ \.(jpg|jpeg|png|gif|webp|svg)$ {
                add_header Vary Accept;
                expires 1y;
            }
        }

        # Directus image transformations
        location /assets/transform/ {
            proxy_pass http://directus/assets/;
            proxy_cache assets_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_key "$scheme$proxy_host$request_uri$arg_width$arg_height$arg_quality$arg_format";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints for forms
        location /api/ {
            proxy_pass http://directus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers for API
            add_header Access-Control-Allow-Origin "https://cybermonkey.net.au" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Directus admin interface (port 8055)
    server {
        listen 8055;
        server_name _;

        location / {
            proxy_pass http://directus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}